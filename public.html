<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public Board - Papan Efisiensi Productivity</title>
<style>
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#10233f}header{background:#102a4a;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:22px}header a{color:#fff}.wrap{max-width:1240px;margin:28px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5ebf3;border-radius:14px;padding:20px}.label{font-size:13px;color:#607089}.value{font-size:28px;font-weight:800;margin-top:8px}.panel{background:#fff;border:1px solid #e5ebf3;border-radius:14px;padding:20px}.panel h2{margin:0 0 18px}.search{text-align:right;margin-bottom:12px}.search input{width:260px;padding:11px;border:1px solid #cbd7e6;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf1f6;font-size:13px}th{color:#52627a;background:#f8fafc}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:700;font-size:12px}.good{background:#e7f7ed;color:#14753a}.warning{background:#fff3d6;color:#9a6500}.low{background:#fde8e7;color:#b42318}.tablewrap{overflow:auto}.empty{text-align:center;color:#607089;padding:25px}.err{padding:12px;background:#fdecec;color:#a51d18;border-radius:9px;margin-bottom:15px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1>🏭 Papan Efisiensi Productivity</h1><a href="index.html">Panel Admin</a></header>
<div class="wrap">
<div id="err"></div>
<section class="cards">
<div class="card"><div class="label">Total Line</div><div id="total" class="value">0</div></div>
<div class="card"><div class="label">Rata-rata Efisiensi</div><div id="avg" class="value">0%</div></div>
<div class="card"><div class="label">Line ≥ 95%</div><div id="good" class="value">0</div></div>
<div class="card"><div class="label">Aktual Produksi</div><div id="qty" class="value">0</div></div>
</section>
<section class="panel">
<h2>Data Productivity</h2>
<div class="search"><input id="search" placeholder="🔎 Cari nama line..."></div>
<div class="tablewrap"><table><thead><tr><th>Line</th><th>Waktu</th><th>CT Std</th><th>CT Actual</th><th>Efisiensi</th><th>Target</th><th>Aktual</th><th>Achievement</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></div>
<script>
const $=s=>document.querySelector(s);let data=[];
async function load(){
 try{const r=await fetch('/api/productivity');const j=await r.json();if(!r.ok)throw Error(j.error||'Gagal memuat data');data=Array.isArray(j.lines)?j.lines:[];render();}
 catch(e){$('#err').innerHTML='<div class="err">'+e.message+'</div>';}
}
function c(x){return{target:x.minutes*60/x.std,eff:x.std/x.actualCt*100,achievement:(x.minutes*60/x.std)>0?x.qty/(x.minutes*60/x.std)*100:0}}
function render(){const q=$('#search').value.toLowerCase();const rows=data.filter(x=>String(x.line).toLowerCase().includes(q));$('#total').textContent=data.length;$('#avg').textContent=(data.length?data.reduce((s,x)=>s+c(x).eff,0)/data.length:0).toFixed(1)+'%';$('#good').textContent=data.filter(x=>c(x).eff>=95).length;$('#qty').textContent=data.reduce((s,x)=>s+Number(x.qty||0),0).toLocaleString('id-ID');$('#rows').innerHTML=rows.length?rows.map(x=>{const z=c(x);const st=z.eff>=95?['GOOD','good']:z.eff>=85?['WARNING','warning']:['LOW','low'];return '<tr><td><b>'+x.line+'</b></td><td>'+x.minutes+' min</td><td>'+Number(x.std).toFixed(2)+'</td><td>'+Number(x.actualCt).toFixed(2)+'</td><td><b>'+z.eff.toFixed(1)+'%</b></td><td>'+z.target.toFixed(0)+'</td><td>'+x.qty+'</td><td>'+z.achievement.toFixed(1)+'%</td><td><span class="pill '+st[1]+'">'+st[0]+'</span></td></tr>'}).join(''):'<tr><td colspan="9" class="empty">Belum ada data line.</td></tr>'}
$('#search').oninput=render;load();
</script>
</body></html>
