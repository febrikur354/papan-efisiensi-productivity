<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<meta
http-equiv="refresh"
content="300">

<title>
Public Board - Productivity per Line
</title>

<script
src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
</script>

<style>

:root{
    --navy:#0b2442;
    --header-text:#fff;
    --blue:#2167e8;
    --bg:#eef3f9;
    --card:#fff;
    --text:#102744;
    --muted:#64758b;
    --border:#dbe4ef;
    --table-head:#f8fafc;

    --good:#087f3e;
    --goodbg:#e5f7ed;
    --warn:#9a6500;
    --warnbg:#fff4d6;
    --low:#b42318;
    --lowbg:#ffe8e6
}

*{
    box-sizing:border-box
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Segoe UI,Arial,sans-serif
}

header{
    background:var(--navy);
    color:var(--header-text);
    padding:20px 3%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px
}

header a{
    color:var(--header-text);
    font-weight:700
}

h1{
    margin:0;
    font-size:26px
}

.sub{
    margin-top:5px;
    font-size:13px;
    opacity:.9
}

.header-actions{
    display:flex;
    align-items:center;
    gap:18px
}

.theme-control{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700
}

.theme-control select{
    height:36px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:8px;
    padding:0 10px;
    background:rgba(255,255,255,.12);
    color:var(--header-text);
    font-weight:700;
    cursor:pointer
}

.theme-control select option{
    background:#fff;
    color:#111827
}

main{
    max-width:1450px;
    margin:22px auto;
    padding:0 18px
}

.tabs{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:16px
}

.tab{
    height:42px;
    padding:0 18px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-weight:800;
    cursor:pointer
}

.tab.active{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue)
}

.linebox{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 8px 26px rgba(20,46,78,.07);
    margin-bottom:18px;
    overflow:hidden
}

.head{
    padding:17px 19px;
    background:var(--table-head);
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between
}

.title{
    font-size:22px;
    font-weight:850
}

.muted{
    font-size:12px;
    color:var(--muted);
    margin-top:4px
}

.badge{
    padding:6px 11px;
    border-radius:99px;
    font-weight:800;
    font-size:12px
}

.good{
    background:var(--goodbg);
    color:var(--good)
}

.warning{
    background:var(--warnbg);
    color:var(--warn)
}

.low{
    background:var(--lowbg);
    color:var(--low)
}

.body{
    padding:18px
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:18px
}

.stat{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px
}

.label{
    font-size:11px;
    color:var(--muted)
}

.value{
    font-size:20px;
    font-weight:850;
    margin-top:5px
}

/* WARNA KPI */

.stat:nth-child(1) .value{
    color:#2563eb
}

.stat:nth-child(2) .value{
    color:#f59e0b
}

.stat:nth-child(3) .value{
    color:#16a34a
}

.stat:nth-child(4) .value{
    color:#8b5cf6
}

.content{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px
}

.chart{
    height:330px;
    position:relative
}

.tablewrap{
    overflow:auto;
    margin-top:18px
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px
}

th,
td{
    padding:10px;
    border-bottom:1px solid var(--border);
    text-align:left;
    font-size:12px;
    white-space:nowrap
}

th{
    background:var(--table-head);
    color:var(--muted)
}

.empty{
    text-align:center;
    padding:45px;
    color:var(--muted)
}

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(3,1fr)
    }

    .content{
        grid-template-columns:1fr
    }

}

@media(max-width:600px){

    .header-actions{
        flex-direction:column;
        align-items:flex-end
    }

    .stats{
        grid-template-columns:1fr 1fr
    }

    main{
        padding:0 10px
    }

}

</style>

</head>


<body>

<header>

<div>

<h1>
🏭 Papan Efisiensi Productivity
</h1>

<div class="sub">
Public Board • Productivity per Line
</div>

</div>


<div class="header-actions">

<div class="theme-control">

<span>🎨 Tema</span>

<select id="themeSelect">

<option value="default">
Default Blue
</option>

<option value="industrial">
Industrial Dark
</option>

<option value="green">
Green Factory
</option>

<option value="orange">
Orange Energy
</option>

<option value="purple">
Purple Modern
</option>

<option value="light">
Light Clean
</option>

</select>

</div>


<a href="/">
Panel Admin ↗
</a>

</div>

</header>


<main>

<div
id="tabs"
class="tabs">
</div>

<div
id="app">
</div>

<div
id="empty"
class="empty"
style="display:none">
Belum ada data.
</div>

</main>


<script>

const API='/api/productivity';

let rec={
    lines:[],
    lineMaster:[]
};

let selected='';

const $=
    id=>document.getElementById(id);


/* =========================
   THEME
========================= */

const themeConfig={

    default:{
        navy:'#0b2442',
        headerText:'#fff',
        blue:'#2167e8',
        bg:'#eef3f9',
        card:'#fff',
        text:'#102744',
        muted:'#64758b',
        border:'#dbe4ef',
        tableHead:'#f8fafc'
    },

    industrial:{
        navy:'#111827',
        headerText:'#fff',
        blue:'#3b82f6',
        bg:'#1f2937',
        card:'#374151',
        text:'#f9fafb',
        muted:'#d1d5db',
        border:'#4b5563',
        tableHead:'#374151'
    },

    green:{
        navy:'#166534',
        headerText:'#fff',
        blue:'#16a34a',
        bg:'#f0fdf4',
        card:'#fff',
        text:'#14532d',
        muted:'#4b6654',
        border:'#bbf7d0',
        tableHead:'#f0fdf4'
    },

    orange:{
        navy:'#9a3412',
        headerText:'#fff',
        blue:'#f97316',
        bg:'#fff7ed',
        card:'#fff',
        text:'#7c2d12',
        muted:'#7c5a48',
        border:'#fed7aa',
        tableHead:'#fff7ed'
    },

    purple:{
        navy:'#581c87',
        headerText:'#fff',
        blue:'#8b5cf6',
        bg:'#faf5ff',
        card:'#fff',
        text:'#4c1d95',
        muted:'#6b5a7c',
        border:'#e9d5ff',
        tableHead:'#faf5ff'
    },

    light:{
        navy:'#fff',
        headerText:'#0f2340',
        blue:'#2563eb',
        bg:'#f8fafc',
        card:'#fff',
        text:'#1e293b',
        muted:'#64748b',
        border:'#e2e8f0',
        tableHead:'#f8fafc'
    }

};


function applyTheme(name){

    const t=
        themeConfig[name]||
        themeConfig.default;

    const map={
        headerText:'header-text',
        tableHead:'table-head'
    };

    for(
        const [key,value]
        of Object.entries(t)
    ){

        document.documentElement
            .style
            .setProperty(
                '--'+
                (map[key]||key),
                value
            );

    }

    localStorage.setItem(
        'productivityTheme',
        name
    );

}


function initTheme(){

    const saved=
        localStorage.getItem(
            'productivityTheme'
        )||'default';

    const select=
        $('themeSelect');

    if(select){

        select.value=saved;

        select.onchange=()=>{
            applyTheme(
                select.value
            );
        };

    }

    applyTheme(saved);

}


/* =========================
   HELPER
========================= */

function fmt(n,d=1){

    return Number(n||0)
        .toLocaleString(
            'id-ID',
            {
                minimumFractionDigits:d,
                maximumFractionDigits:d
            }
        );

}


function esc(s){

    return String(s??'')
        .replace(
            /[&<>"']/g,
            m=>({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'
            }[m])
        );

}


function calc(x){

    const min=+x.minutes||0;
    const std=+x.std||0;
    const ct=+x.actualCt||0;
    const qty=+x.qty||0;

    const target=
        std?min*60/std:0;

    const eff=
        ct?std/ct*100:0;

    const ach=
        target?qty/target*100:0;

    return{
        target,
        eff,
        ach,
        status:
            eff>=95
            ?'GOOD'
            :eff>=85
            ?'WARNING'
            :'LOW'
    };

}


/* =========================
   LOAD DATA
========================= */

async function load(){

    const r=
        await fetch(
            API+'?t='+Date.now(),
            {
                cache:'no-store'
            }
        );

    const j=
        await r.json();

    rec={
        lines:
            Array.isArray(j?.lines)
            ?j.lines
            :[],

        lineMaster:
            Array.isArray(j?.lineMaster)
            ?j.lineMaster
            :[]
    };

    rec.lineMaster=[
        ...new Set([
            ...rec.lineMaster,
            ...rec.lines
                .map(x=>x.line)
                .filter(Boolean)
        ])
    ];

    selected=
        selected&&
        rec.lineMaster.includes(selected)
        ?selected
        :(rec.lineMaster[0]||'');

    render();

}


/* =========================
   RENDER
========================= */

function render(){

    const tabs=$('tabs');
    const app=$('app');

    tabs.innerHTML='';
    app.innerHTML='';

    $('empty').style.display=
        rec.lineMaster.length
        ?'none'
        :'block';


    rec.lineMaster.forEach(n=>{

        const b=
            document.createElement(
                'button'
            );

        b.className=
            'tab '+
            (n===selected?'active':'');

        b.textContent=n;

        b.onclick=()=>{
            selected=n;
            render();
        };

        tabs.appendChild(b);

    });


    if(!selected)return;


    const arr=
        rec.lines
            .filter(
                x=>x.line===selected
            )
            .sort(
                (a,b)=>
                    new Date(a.date)-
                    new Date(b.date)
            );


    const avg=
        arr.length
        ?arr.reduce(
            (s,x)=>
                s+calc(x).eff,
            0
        )/arr.length
        :0;


    const totalTarget=
        arr.reduce(
            (s,x)=>
                s+calc(x).target,
            0
        );


    const totalQty=
        arr.reduce(
            (s,x)=>
                s+(+x.qty||0),
            0
        );


    const ach=
        totalTarget
        ?totalQty/totalTarget*100
        :0;


    const status=
        avg>=95
        ?'GOOD'
        :avg>=85
        ?'WARNING'
        :'LOW';


    const cls=
        status==='GOOD'
        ?'good'
        :status==='WARNING'
        ?'warning'
        :'low';


    const box=
        document.createElement(
            'section'
        );

    box.className='linebox';


    box.innerHTML=`

<div class="head">

<div>

<div class="title">
LINE ${esc(selected)}
</div>

<div class="muted">
${arr.length} data produksi
</div>

</div>

<span class="badge ${cls}">
${status}
</span>

</div>


<div class="body">


<div class="stats">

<div class="stat">

<div class="label">
Rata-rata Efisiensi
</div>

<div class="value">
${fmt(avg,1)}%
</div>

</div>


<div class="stat">

<div class="label">
Target
</div>

<div class="value">
${fmt(totalTarget,0)}
</div>

</div>


<div class="stat">

<div class="label">
Aktual
</div>

<div class="value">
${fmt(totalQty,0)}
</div>

</div>


<div class="stat">

<div class="label">
Achievement
</div>

<div class="value">
${fmt(ach,1)}%
</div>

</div>


<div class="stat">

<div class="label">
Jumlah Data
</div>

<div class="value">
${arr.length}
</div>

</div>

</div>


<div class="content">

<div class="chart">
<canvas id="eff"></canvas>
</div>

<div class="chart">
<canvas id="qty"></canvas>
</div>

</div>


<div class="tablewrap">

<table>

<thead>

<tr>

<th>Tanggal</th>
<th>Waktu</th>
<th>CT Std</th>
<th>CT Actual</th>
<th>Efisiensi</th>
<th>Target</th>
<th>Aktual</th>
<th>Achievement</th>
<th>Status</th>

</tr>

</thead>


<tbody>

${arr.map(x=>{

    const c=calc(x);

    const cc=
        c.status==='GOOD'
        ?'good'
        :c.status==='WARNING'
        ?'warning'
        :'low';


    return `

<tr>

<td>${esc(x.date)}</td>

<td>
${fmt(x.minutes,0)} min
</td>

<td>
${fmt(x.std,2)}
</td>

<td>
${fmt(x.actualCt,2)}
</td>

<td>
<strong>
${fmt(c.eff,1)}%
</strong>
</td>

<td>
${fmt(c.target,0)}
</td>

<td>
${fmt(x.qty,0)}
</td>

<td>
${fmt(c.ach,1)}%
</td>

<td>

<span class="badge ${cc}">
${c.status}
</span>

</td>

</tr>

`;

}).join('')}

</tbody>

</table>

</div>

</div>

`;


    app.appendChild(box);


    const dates=[
        ...new Set(
            arr.map(x=>x.date)
        )
    ].sort(
        (a,b)=>
            new Date(a)-
            new Date(b)
    );


    const labels=
        dates.map(d=>{

            const p=d.split('-');

            return p.length===3
                ?`${p[2]}/${p[1]}/${p[0]}`
                :d;

        });


    const eff=
        dates.map(d=>{

            const r=
                arr.filter(
                    x=>x.date===d
                );

            return r.reduce(
                (s,x)=>
                    s+calc(x).eff,
                0
            )/r.length;

        });


    const target=
        dates.map(d=>
            arr
                .filter(
                    x=>x.date===d
                )
                .reduce(
                    (s,x)=>
                        s+calc(x).target,
                    0
                )
        );


    const qty=
        dates.map(d=>
            arr
                .filter(
                    x=>x.date===d
                )
                .reduce(
                    (s,x)=>
                        s+(+x.qty||0),
                    0
                )
        );


    /* EFISIENSI */

    new Chart(
        $('eff'),
        {

            type:'line',

            data:{

                labels,

                datasets:[{

                    label:'Efisiensi %',

                    data:eff,

                    tension:.25,

                    pointRadius:5,

                    borderColor:'#2563eb',

                    backgroundColor:
                        'rgba(37,99,235,.15)',

                    pointBackgroundColor:
                        '#2563eb',

                    pointBorderColor:
                        '#2563eb'

                }]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                plugins:{
                    legend:{
                        position:'bottom'
                    }
                },

                scales:{

                    y:{

                        suggestedMin:70,

                        title:{
                            display:true,
                            text:'Efisiensi (%)'
                        }

                    },

                    x:{

                        title:{
                            display:true,
                            text:'Tanggal Produksi'
                        }

                    }

                }

            }

        }
    );


    /* TARGET + ACTUAL */

    new Chart(
        $('qty'),
        {

            type:'bar',

            data:{

                labels,

                datasets:[

                    {

                        label:'Target',

                        data:target,

                        type:'line',

                        borderColor:'#f59e0b',

                        backgroundColor:'#f59e0b',

                        pointBackgroundColor:
                            '#f59e0b',

                        pointBorderColor:
                            '#f59e0b',

                        borderWidth:3,

                        tension:.2,

                        pointRadius:4

                    },

                    {

                        label:'Aktual',

                        data:qty,

                        type:'bar',

                        backgroundColor:
                            'rgba(16,185,129,.65)',

                        borderColor:
                            '#10b981',

                        borderWidth:1

                    }

                ]

            },

            options:{

                responsive:true,

                maintainAspectRatio:false,

                plugins:{
                    legend:{
                        position:'bottom'
                    }
                },

                scales:{

                    y:{
                        beginAtZero:true,

                        title:{
                            display:true,
                            text:'Qty (pcs)'
                        }

                    },

                    x:{

                        title:{
                            display:true,
                            text:'Tanggal Produksi'
                        }

                    }

                }

            }

        }

    );

}


/* START */

initTheme();

load();

setInterval(
    load,
    300000
);

</script>

</body>
</html>
