<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="300">
<title>Public Board - Productivity per Line</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--navy:#0b2442;--bg:#eef3f9;--card:#fff;--text:#102744;--muted:#64758b;--border:#dbe4ef;--good:#087f3e;--goodbg:#e5f7ed;--warn:#9a6500;--warnbg:#fff4d6;--low:#b42318;--lowbg:#ffe8e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#0b2442,#163f6c);color:#fff;padding:20px 3%;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;font-weight:700}h1{margin:0;font-size:26px}.sub{margin-top:5px;font-size:13px;opacity:.9}
main{max-width:1450px;margin:22px auto;padding:0 18px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.tab{height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--border);background:#fff;font-weight:800;cursor:pointer}.tab.active{background:#2167e8;color:#fff;border-color:#2167e8}.linebox{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 26px rgba(20,46,78,.07);margin-bottom:18px;overflow:hidden}.head{padding:17px 19px;background:#f7f9fc;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.title{font-size:22px;font-weight:850}.muted{font-size:12px;color:var(--muted);margin-top:4px}.badge{padding:6px 11px;border-radius:99px;font-weight:800;font-size:12px}.good{background:var(--goodbg);color:var(--good)}.warning{background:var(--warnbg);color:var(--warn)}.low{background:var(--lowbg);color:var(--low)}.body{padding:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat{border:1px solid #e3eaf2;border-radius:10px;padding:12px;border-top:4px solid #d7e1ef}.stat.eff{border-top-color:var(--c-eff)}.stat.target{border-top-color:var(--c-target)}.stat.actual{border-top-color:var(--c-actual)}.stat.ach{border-top-color:var(--c-ach)}.stat.eff .value{color:var(--c-eff)}.stat.target .value{color:var(--c-target)}.stat.actual .value{color:var(--c-actual)}.stat.ach .value{color:var(--c-ach)}.label{font-size:11px;color:var(--muted)}.value{font-size:20px;font-weight:850;margin-top:5px}.content{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chart{height:330px;position:relative}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #e5ebf2;text-align:left;font-size:12px;white-space:nowrap}th{background:#f8fafc;color:#52657d}.empty{text-align:center;padding:45px;color:var(--muted)}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.content{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}main{padding:0 10px}}
</style>
</head>
<body>
<header><div><h1>🏭 Papan Efisiensi Productivity</h1><div class="sub">Public Board • Productivity per Line</div></div><a href="/">Panel Admin ↗</a></header>
<main><div id="tabs" class="tabs"></div><div id="app"></div><div id="empty" class="empty" style="display:none">Belum ada data.</div></main>
<script>
const API='/api/productivity';let rec={lines:[],lineMaster:[]},selected='';
const $=id=>document.getElementById(id);
function fmt(n,d=1){return Number(n||0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function calc(x){const min=+x.minutes||0,std=+x.std||0,ct=+x.actualCt||0,qty=+x.qty||0,target=std?min*60/std:0,eff=ct?std/ct*100:0,ach=target?qty/target*100:0;return{target,eff,ach,status:eff>=95?'GOOD':eff>=85?'WARNING':'LOW'}}
async function load(){const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});const j=await r.json();rec={lines:Array.isArray(j?.lines)?j.lines:[],lineMaster:Array.isArray(j?.lineMaster)?j.lineMaster:[]};rec.lineMaster=[...new Set([...rec.lineMaster,...rec.lines.map(x=>x.line).filter(Boolean)])];selected=selected&&rec.lineMaster.includes(selected)?selected:(rec.lineMaster[0]||'');render()}
function render(){const tabs=$('tabs'),app=$('app');tabs.innerHTML='';app.innerHTML='';$('empty').style.display=rec.lineMaster.length?'none':'block';rec.lineMaster.forEach(n=>{const b=document.createElement('button');b.className='tab '+(n===selected?'active':'');b.textContent=n;b.onclick=()=>{selected=n;render()};tabs.appendChild(b)});if(!selected)return;const arr=rec.lines.filter(x=>x.line===selected).sort((a,b)=>new Date(a.date)-new Date(b.date));const avg=arr.length?arr.reduce((s,x)=>s+calc(x).eff,0)/arr.length:0,totalTarget=arr.reduce((s,x)=>s+calc(x).target,0),totalQty=arr.reduce((s,x)=>s+(+x.qty||0),0),ach=totalTarget?totalQty/totalTarget*100:0,status=avg>=95?'GOOD':avg>=85?'WARNING':'LOW',cls=status==='GOOD'?'good':status==='WARNING'?'warning':'low';const box=document.createElement('section');box.className='linebox';box.innerHTML=`<div class="head"><div><div class="title">LINE ${esc(selected)}</div><div class="muted">${arr.length} data produksi</div></div><span class="badge ${cls}">${status}</span></div><div class="body"><div class="stats"><div class="stat eff"><div class="label">Rata-rata Efisiensi</div><div class="value">${fmt(avg,1)}%</div></div><div class="stat target"><div class="label">Target</div><div class="value">${fmt(totalTarget,0)}</div></div><div class="stat actual"><div class="label">Aktual</div><div class="value">${fmt(totalQty,0)}</div></div><div class="stat ach"><div class="label">Achievement</div><div class="value">${fmt(ach,1)}%</div></div><div class="stat"><div class="label">Jumlah Data</div><div class="value">${arr.length}</div></div></div><div class="content"><div class="chart"><canvas id="eff"></canvas></div><div class="chart"><canvas id="qty"></canvas></div></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Waktu</th><th>CT Std</th><th>CT Actual</th><th>Efisiensi</th><th>Target</th><th>Aktual</th><th>Achievement</th><th>Status</th></tr></thead><tbody>${arr.map(x=>{const c=calc(x),cc=c.status==='GOOD'?'good':c.status==='WARNING'?'warning':'low';return `<tr><td>${esc(x.date)}</td><td>${fmt(x.minutes,0)} min</td><td>${fmt(x.std,2)}</td><td>${fmt(x.actualCt,2)}</td><td><strong>${fmt(c.eff,1)}%</strong></td><td>${fmt(c.target,0)}</td><td>${fmt(x.qty,0)}</td><td>${fmt(c.ach,1)}%</td><td><span class="badge ${cc}">${c.status}</span></td></tr>`}).join('')}</tbody></table></div></div>`;app.appendChild(box);const dates=[...new Set(arr.map(x=>x.date))].sort((a,b)=>new Date(a)-new Date(b)),labels=dates.map(d=>{const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d}),eff=dates.map(d=>{const r=arr.filter(x=>x.date===d);return r.reduce((s,x)=>s+calc(x).eff,0)/r.length}),target=dates.map(d=>arr.filter(x=>x.date===d).reduce((s,x)=>s+calc(x).target,0)),qty=dates.map(d=>arr.filter(x=>x.date===d).reduce((s,x)=>s+(+x.qty||0),0));new Chart($('eff'),{type:'bar',data:{labels,datasets:[{label:'Efisiensi %',data:eff,backgroundColor:'rgba(37,99,235,.72)',borderColor:'#2563eb',borderWidth:1,borderRadius:5,maxBarThickness:45}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{suggestedMin:0,title:{display:true,text:'Efisiensi (%)'}},x:{title:{display:true,text:'Tanggal Produksi'}}}}});new Chart($('qty'),{data:{labels,datasets:[{type:'bar',label:'Actual',data:qty,backgroundColor:'rgba(22,163,74,.72)',borderColor:'#16a34a',borderWidth:1,borderRadius:5,maxBarThickness:45},{type:'line',label:'Target',data:target,tension:.25,pointRadius:4,pointHoverRadius:6,borderWidth:3,borderColor:'#f59e0b',backgroundColor:'#f59e0b',pointBackgroundColor:'#f59e0b',pointBorderColor:'#fff',pointBorderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,title:{display:true,text:'Qty (pcs)'}},x:{title:{display:true,text:'Tanggal Produksi'}}}}})}
load();setInterval(load,300000);
</script>
</body>
</html>
