<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papan Efisiensi Productivity</title>
<style>
:root{--nav:#102a4a;--bg:#f4f7fb;--card:#fff;--text:#10233f;--muted:#607089;--primary:#1769ff;--danger:#d92d20;--ok:#16803c;--warn:#b77900;--border:#d8e1ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--nav);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px}header small{display:block;margin-top:4px;opacity:.85}header a{color:#fff}
.wrap{max-width:1240px;margin:28px auto;padding:0 18px}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:14px;display:none}.alert.ok{display:block;background:#e8f7ee;color:#11652f}.alert.err{display:block;background:#fdecec;color:#a51d18}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid #e5ebf3;border-radius:14px;padding:20px;box-shadow:0 4px 16px #17365d0d}.label{font-size:13px;color:var(--muted)}.value{font-size:28px;font-weight:800;margin-top:8px}
.panel{background:#fff;border:1px solid #e5ebf3;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 4px 16px #17365d0d}
.panel h2{margin:0 0 18px;font-size:22px}.form{display:grid;grid-template-columns:1.1fr 1.1fr 1.1fr 1.1fr 1.1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid #cbd7e6;border-radius:9px;font-size:14px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#e9eef6;color:#20314b}.danger{background:#ffe8e6;color:#b42318}.search{display:flex;justify-content:flex-end;margin-bottom:12px}.search input{width:260px;padding:11px 12px;border:1px solid #cbd7e6;border-radius:9px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #edf1f6;font-size:13px}th{color:#52627a;background:#f8fafc}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:700;font-size:12px}.good{background:#e7f7ed;color:#14753a}.warning{background:#fff3d6;color:#9a6500}.low{background:#fde8e7;color:#b42318}.empty{text-align:center;color:var(--muted);padding:25px}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){header{padding:15px}.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.search input{width:100%}.search{display:block}}
</style>
</head>
<body>
<header>
  <div><h1>🏭 Papan Efisiensi Productivity</h1><small>Panel Admin • tanpa login</small></div>
  <a href="public.html" target="_blank">Public Board ↗</a>
</header>

<div class="wrap">
  <div id="alert" class="alert"></div>

  <section class="cards">
    <div class="card"><div class="label">Total Line</div><div id="totalLine" class="value">0</div></div>
    <div class="card"><div class="label">Rata-rata Efisiensi</div><div id="avgEff" class="value">0%</div></div>
    <div class="card"><div class="label">Line ≥ 95%</div><div id="goodLine" class="value">0</div></div>
    <div class="card"><div class="label">Aktual Produksi</div><div id="totalQty" class="value">0</div></div>
  </section>

  <section class="panel">
    <h2>Input / Update Line</h2>
    <div class="form">
      <div class="field"><label>Nama Line</label><input id="line" placeholder="Contoh: REAR 1"></div>
      <div class="field"><label>Waktu Produksi (menit)</label><input id="minutes" type="number" min="1" placeholder="480"></div>
      <div class="field"><label>CT Standard (detik/pcs)</label><input id="std" type="number" min="0.01" step="0.01" placeholder="45"></div>
      <div class="field"><label>CT Actual (detik/pcs)</label><input id="actualCt" type="number" min="0.01" step="0.01" placeholder="48"></div>
      <div class="field"><label>Aktual Produksi (pcs)</label><input id="qty" type="number" min="0" step="1" placeholder="560"></div>
      <div class="actions">
        <button class="btn primary" id="save">Simpan Data</button>
        <button class="btn secondary" id="reset">Reset</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Data Productivity</h2>
    <div class="search"><input id="search" placeholder="🔎 Cari nama line..."></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Line</th><th>Waktu</th><th>CT Std</th><th>CT Actual</th><th>Efisiensi</th><th>Target</th><th>Aktual</th><th>Achievement</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
let data=[];

async function api(url, options={}){
  const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||j.message||('HTTP '+r.status));
  return j;
}

function show(msg,type='ok'){
  const el=$('#alert');
  el.textContent=msg;
  el.className='alert '+type;
  clearTimeout(show.t);
  show.t=setTimeout(()=>el.className='alert',3500);
}

function calc(x){
  const target=x.minutes*60/x.std;
  const eff=x.std/x.actualCt*100;
  const achievement=target>0?x.qty/target*100:0;
  return {target,eff,achievement};
}

function status(eff){
  if(eff>=95) return ['GOOD','good'];
  if(eff>=85) return ['WARNING','warning'];
  return ['LOW','low'];
}

function render(){
  const q=$('#search').value.trim().toLowerCase();
  const rows=data.filter(x=>String(x.line).toLowerCase().includes(q));

  $('#totalLine').textContent=data.length;
  $('#avgEff').textContent=(data.length?data.reduce((s,x)=>s+calc(x).eff,0)/data.length:0).toFixed(1)+'%';
  $('#goodLine').textContent=data.filter(x=>calc(x).eff>=95).length;
  $('#totalQty').textContent=data.reduce((s,x)=>s+Number(x.qty||0),0).toLocaleString('id-ID');

  $('#rows').innerHTML=rows.length?rows.map(x=>{
    const c=calc(x), st=status(c.eff);
    return `<tr>
      <td><b>${esc(x.line)}</b></td>
      <td>${x.minutes} min</td><td>${Number(x.std).toFixed(2)}</td><td>${Number(x.actualCt).toFixed(2)}</td>
      <td><b>${c.eff.toFixed(1)}%</b></td><td>${c.target.toFixed(0)}</td><td>${x.qty}</td>
      <td>${c.achievement.toFixed(1)}%</td><td><span class="pill ${st[1]}">${st[0]}</span></td>
      <td><button class="btn secondary" onclick="editRow('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteRow('${x.id}')">Hapus</button></td>
    </tr>`;
  }).join(''):'<tr><td colspan="10" class="empty">Belum ada data line.</td></tr>';
}

function esc(v){
  return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function reset(){
  $('#line').value=''; $('#minutes').value=''; $('#std').value=''; $('#actualCt').value=''; $('#qty').value='';
  $('#save').dataset.editId='';
}

window.editRow=function(id){
  const x=data.find(v=>v.id===id); if(!x)return;
  $('#save').dataset.editId=x.id;
  $('#line').value=x.line; $('#minutes').value=x.minutes; $('#std').value=x.std; $('#actualCt').value=x.actualCt; $('#qty').value=x.qty;
  window.scrollTo({top:0,behavior:'smooth'});
};

window.deleteRow=async function(id){
  if(!confirm('Hapus data line ini?')) return;
  try{
    const next=data.filter(x=>x.id!==id);
    await api('/api/productivity',{method:'PUT',body:JSON.stringify({lines:next})});
    data=next; render(); show('Data berhasil dihapus.');
  }catch(e){show(e.message,'err');}
};

$('#save').onclick=async function(){
  const line=$('#line').value.trim();
  const minutes=Number($('#minutes').value);
  const std=Number($('#std').value);
  const actualCt=Number($('#actualCt').value);
  const qty=Number($('#qty').value);
  if(!line||minutes<=0||std<=0||actualCt<=0||qty<0){
    show('Lengkapi data dengan benar.','err'); return;
  }
  const id=$('#save').dataset.editId || crypto.randomUUID();
  const obj={id,line,minutes,std,actualCt,qty};
  const next=[...data.filter(x=>x.id!==id),obj];
  try{
    await api('/api/productivity',{method:'PUT',body:JSON.stringify({lines:next})});
    data=next; render(); reset(); show('Data berhasil disimpan.');
  }catch(e){show(e.message,'err');}
};

$('#reset').onclick=reset;
$('#search').oninput=render;

async function load(){
  try{
    const j=await api('/api/productivity');
    data=Array.isArray(j.lines)?j.lines:[];
    render();
  }catch(e){
    show('Gagal memuat data: '+e.message,'err');
  }
}
load();
</script>
</body>
</html>
